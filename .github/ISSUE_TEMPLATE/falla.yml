name: Algo no funciona
description: Cuéntanos qué falló para poder arreglarlo
labels: ["falla"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Jícaro es gratis y sin publicidad; tus reportes lo hacen mejor para todos.
        No pongas contraseñas ni datos personales, y no subas archivos que no sean tuyos.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Cuéntalo con tus palabras. Si sale un mensaje, cópialo.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: ¿Qué hiciste antes de que fallara?
      placeholder: |
        1. Abrí Jícaro
        2. Arrastré el archivo...
        3. ...
  - type: input
    id: tipo
    attributes:
      label: Tipo de archivo
      description: Por ejemplo ZIP, RAR en varias partes, 7z, ISO...
      placeholder: "RAR en 16 partes"
  - type: textarea
    id: esperabas
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: version
    attributes:
      label: Versión de Jícaro
      description: Está en Ayuda → Acerca de Jícaro.
      placeholder: "0.1.0"
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11"
  - type: textarea
    id: registro
    attributes:
      label: Registro (opcional)
      description: Pega aquí el contenido de %LOCALAPPDATA%\Jicaro\registro.txt (no guarda nombres de archivos).
      render: text
