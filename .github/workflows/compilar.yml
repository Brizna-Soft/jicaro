# Compila Jícaro desde este código en cada cambio (en cualquier rama) y corre las pruebas sin ventana. Con una
# etiqueta v* (por ejemplo v0.2.0) además publica la versión en Releases con el .zip, su huella SHA-256 y el código
# fuente de la 7-Zip que va adentro (7z.dll es LGPL): así los .zip salen de GitHub, no de una PC.
name: Compilar

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write   # solo se usa para crear la versión cuando hay etiqueta
      id-token: write   # para la atestación de origen del .zip (solo con etiqueta)
      attestations: write
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vendor\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vendor\vcpkg-binarios
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Bajar vcpkg (versión fija)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # Si cambian las bibliotecas, se parte de la caché anterior: solo se compila lo nuevo
      - name: Traer las bibliotecas ya compiladas (caché)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/vcpkg-binarios
          key: vcpkg-2026.10.16-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-2026.10.16-

      # Aparte de la compilación del programa, para guardar la caché aunque el programa no compile
      - name: Preparar las bibliotecas (wxWidgets y libarchive)
        shell: pwsh
        run: ./compilar.ps1 -Publicacion -SoloPreparar

      - name: Guardar las bibliotecas compiladas (caché)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/vcpkg-binarios
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Compilar
        shell: pwsh
        run: ./compilar.ps1 -Publicacion

      # Rutas peligrosas, partes, contraseñas (también RAR y 7z con 7z.dll), enlaces, bomba chica y la marca de la Web,
      # con archivos de verdad
      - name: Pruebas sin ventana (CTest, corre pruebas/probar.ps1)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron pruebas' }

      - name: Empaquetar
        shell: pwsh
        run: ./empaquetar.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: jicaro
          path: publicar/*.zip*

      # Prueba pública de que el .zip lo armó GitHub con este código. Se comprueba con:
      #   gh attestation verify <archivo.zip> --repo Brizna-Soft/jicaro
      - name: Atestación de origen del .zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: publicar/Jicaro-*.zip

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notas = @"
          Jícaro ${version}: descompresor gratis para Windows 10 y 11, sin publicidad y sin recoger datos.

          1. Baja ``Jicaro-$version-x64.zip``, descomprímelo y abre ``Jicaro.exe``.
          2. Si Windows dice «Windows protegió su PC», pulsa «Más información» y luego «Ejecutar de todas formas»
             (el programa es nuevo y aún no tiene firma digital).
          3. La huella SHA-256 está en el archivo ``.sha256``. Este .zip lo armó GitHub a partir de este mismo código.

          Trae 7z.dll de 7-Zip (de Igor Pavlov, licencia GNU LGPL) para abrir los RAR y los 7z. Su código fuente, de la
          misma versión, va aquí abajo (``7z*-src.7z``) y en https://www.7-zip.org.
          "@
          $archivos = @((Get-ChildItem publicar -Filter 'Jicaro-*').FullName) + @((Get-ChildItem build\7zip -Filter '7z*-src.7z').FullName)
          gh release create "${{ github.ref_name }}" $archivos --title "Jícaro $version" --notes $notas
